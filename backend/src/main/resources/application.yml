spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postpe
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  jwt:
    secret: postpe-jwt-secret-key-2024-very-long-and-secure-must-be-256-bits-minimum
    expiration: 86400000
  upload:
    path: ./uploads
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

server:
  port: 8080

logging:
  level:
    com.postpe: DEBUG
    org.springframework.security: WARN
